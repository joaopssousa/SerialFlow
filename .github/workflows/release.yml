name: Release

# Publica uma release ao empurrar uma tag de versão:
#   git tag v1.0.0 && git push origin v1.0.0
# Ou manualmente pela aba Actions (Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 (glibc 2.35): binário roda em distros dessa geração ou mais novas
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 file

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: appimagetool
        run: |
          curl -sSfL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # sem FUSE no runner: o próprio appimagetool se extrai para rodar
          printf '#!/bin/sh\nexec /tmp/appimagetool --appimage-extract-and-run "$@"\n' \
            | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build
        env:
          PYTHON: python
          APPIMAGETOOL: /usr/local/bin/appimagetool
        run: ./scripts/build_release.sh

      - name: Publica a release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/SerialForge-x86_64.AppImage
            dist/SerialForge-linux-x86_64.tar.gz

      - name: Artefatos (execução manual)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: serialforge-linux-x86_64
          path: |
            dist/SerialForge-x86_64.AppImage
            dist/SerialForge-linux-x86_64.tar.gz
